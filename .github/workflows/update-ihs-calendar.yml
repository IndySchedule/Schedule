name: Update IHS calendar and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: indy-schedule-pages
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install calendar parser
        run: npm install --no-package-lock --ignore-scripts

      - name: Build calendar data
        id: calendar
        run: npm run update-calendar

      - name: Validate calendar and lunch data
        run: npm run validate-live-data

      - name: Commit changed calendar content
        if: steps.calendar.outputs.content_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ihs-calendar-events.json
          git commit -m "Update IHS calendar events"
          git push

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'assets/special-editions/*-master.png' \
            --exclude 'tools' \
            --exclude 'tests' \
            --exclude '_site' \
            --exclude 'package.json' \
            ./ _site/

      - name: Deploy refreshed site to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDYSCHEDULE_1 }}
          channelId: live
          projectId: indyschedule-1
          target: production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update-calendar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
