name: Update IHS calendar events

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ihs-calendar
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install calendar parser
        run: npm install --no-package-lock --ignore-scripts

      - name: Build calendar data
        run: npm run update-calendar

      - name: Commit updated events
        run: |
          if git diff --quiet -- data/ihs-calendar-events.json; then
            echo "Calendar data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ihs-calendar-events.json
          git commit -m "Update IHS calendar events"
          git push
