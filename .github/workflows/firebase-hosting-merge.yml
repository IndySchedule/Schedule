name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm test
      - run: npm run test:firestore-rules
      - run: npm run validate-live-data
      - run: npm run check:performance
  build_and_deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDYSCHEDULE_1 }}
          channelId: live
          projectId: indyschedule-1
          target: production
