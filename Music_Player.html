<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Music</title>
  <meta name="theme-color" content="#0b0e13" />
  <link id="dynamicFavicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c8cff'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='36' fill='white'%3E%E2%99%AB%3C/text%3E%3C/svg%3E" />
  <style>

    :root {
      --bg:#090c11;
      --sidebar:#0f141c;
      --surface:#151b25;
      --surface-2:#1b2330;
      --surface-3:#232c3a;
      --border:rgba(255,255,255,.075);
      --border-strong:rgba(255,255,255,.12);
      --text:#f7f8fb;
      --muted:#96a2b4;
      --muted-2:#6f7a8a;
      --accent:#8295ff;
      --accent-2:#6d7fff;
      --danger:#ff7474;
      --shadow:0 24px 70px rgba(0,0,0,.34);
      --main-bg-image:none;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body {
      min-height:100vh;
      min-height:100dvh;
    }

    button,
    input {
      font:inherit;
    }

    button {
      border:0;
      cursor:pointer;
      color:inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline:2px solid rgba(130,149,255,.9);
      outline-offset:2px;
    }

    .app {
      height:100vh;
      height:100dvh;
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
      overflow:hidden;
      background:var(--bg);
    }

    /* ---------- Sidebar ---------- */

    .sidebar {
      position:relative;
      z-index:5;
      min-width:0;
      min-height:0;
      height:100%;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), transparent 22%),
        var(--sidebar);
      border-right:1px solid var(--border);
      box-shadow:8px 0 30px rgba(0,0,0,.12);
    }

    .sidebar > .brand,
    .sidebar > .stack,
    .sidebar > .section-label,
    .sidebar > .search,
    .sidebar > .playlist-list {
      flex-shrink:0;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:11px;
      padding:2px 2px 4px;
      font-size:19px;
      font-weight:800;
      letter-spacing:-.025em;
    }

    .brand-icon {
      width:38px;
      height:38px;
      border-radius:12px;
      display:grid;
      place-items:center;
      color:white;
      font-size:19px;
      background:linear-gradient(145deg, #8ba0ff, #697cff);
      box-shadow:
        0 10px 22px rgba(105,124,255,.26),
        inset 0 1px 0 rgba(255,255,255,.26);
    }

    .stack {
      display:grid;
      gap:8px;
    }

    .primary,
    .secondary {
      width:100%;
      min-height:42px;
      padding:10px 14px;
      border-radius:12px;
      font-weight:750;
      letter-spacing:-.01em;
      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;
    }

    .primary {
      color:#0c1017;
      background:linear-gradient(180deg,#ffffff,#edf0f6);
      box-shadow:0 8px 20px rgba(0,0,0,.16);
    }

    .primary:hover {
      transform:translateY(-1px);
      box-shadow:0 11px 26px rgba(0,0,0,.21);
    }

    .primary:active {
      transform:translateY(0);
    }

    .secondary {
      color:#eef1f7;
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.028));
      border:1px solid var(--border-strong);
    }

    .secondary:hover {
      background:rgba(255,255,255,.075);
      border-color:rgba(255,255,255,.16);
    }

    .section-label {
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#a5b0c1;
      font-size:10.5px;
      font-weight:800;
      letter-spacing:.07em;
      text-transform:uppercase;
    }

    .section-label > span:first-child {
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .playlist-list {
      display:grid;
      grid-auto-rows:minmax(46px, auto);
      gap:6px;
      min-height:46px;
      max-height:128px;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:3px;
      scrollbar-width:thin;
      scrollbar-color:#394353 transparent;
    }

    .playlist {
      min-height:46px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 34px;
      align-items:center;
      gap:2px;
      overflow:hidden;
      border-radius:12px;
      background:rgba(255,255,255,.025);
      border:1px solid transparent;
      transition:
        background .16s ease,
        border-color .16s ease,
        transform .16s ease;
    }

    .playlist:hover {
      background:rgba(255,255,255,.048);
    }

    .playlist.active {
      background:
        linear-gradient(90deg, rgba(130,149,255,.17), rgba(130,149,255,.065));
      border-color:rgba(130,149,255,.24);
      box-shadow:inset 3px 0 0 var(--accent);
    }

    .playlist-select {
      min-width:0;
      min-height:44px;
      padding:8px 10px 8px 12px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:transparent;
      text-align:left;
      border-radius:11px;
    }

    .playlist-name {
      display:block;
      color:#eef2f8;
      font-size:12.5px;
      font-weight:750;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .playlist-meta {
      display:block;
      margin-top:2px;
      color:var(--muted-2);
      font-size:10px;
      font-weight:600;
    }

    .playlist-remove {
      width:30px;
      height:30px;
      border-radius:9px;
      background:transparent;
      color:#748093;
      font-size:17px;
      line-height:1;
      transition:background .15s ease, color .15s ease;
    }

    .playlist-remove:hover {
      color:#ff9a9a;
      background:rgba(255,116,116,.1);
    }

    .search {
      width:100%;
      min-height:40px;
      padding:10px 12px;
      border-radius:11px;
      border:1px solid var(--border);
      outline:none;
      color:var(--text);
      background:rgba(5,8,13,.58);
      transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .search::placeholder {
      color:#697484;
    }

    .search:hover {
      background:rgba(5,8,13,.74);
    }

    .search:focus {
      background:#0b1017;
      border-color:rgba(130,149,255,.55);
      box-shadow:0 0 0 3px rgba(130,149,255,.09);
    }

    .track-list {
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:3px;
      scrollbar-width:thin;
      scrollbar-color:#394353 transparent;
    }

    .playlist-list::-webkit-scrollbar,
    .track-list::-webkit-scrollbar {
      width:7px;
    }

    .playlist-list::-webkit-scrollbar-track,
    .track-list::-webkit-scrollbar-track {
      background:transparent;
    }

    .playlist-list::-webkit-scrollbar-thumb,
    .track-list::-webkit-scrollbar-thumb {
      border-radius:999px;
      background:#394353;
    }

    .track {
      width:100%;
      min-height:53px;
      display:grid;
      grid-template-columns:24px 42px minmax(0,1fr);
      align-items:center;
      gap:9px;
      padding:6px 8px;
      margin-bottom:3px;
      border-radius:11px;
      background:transparent;
      text-align:left;
      transition:background .14s ease, transform .14s ease;
    }

    .track:hover {
      background:rgba(255,255,255,.048);
    }

    .track.active {
      background:linear-gradient(90deg, rgba(130,149,255,.15), rgba(130,149,255,.045));
    }

    .track-number {
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
      color:#657183;
      font-size:10.5px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .track.active .track-number {
      color:#bfcaff;
    }

    .track-art,
    .track-art-placeholder {
      width:42px;
      height:42px;
      border-radius:9px;
      box-shadow:0 5px 14px rgba(0,0,0,.22);
    }

    .track-art {
      object-fit:cover;
      background:#202734;
      display:block;
    }

    .track-art-placeholder {
      display:grid;
      place-items:center;
      color:#aab4c5;
      font-size:15px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.06), transparent),
        #202734;
    }

    .track-title {
      color:#edf1f7;
      font-size:12.5px;
      font-weight:730;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .track-sub {
      margin-top:2px;
      color:#788496;
      font-size:10.5px;
      font-weight:550;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .empty {
      color:#7f8a9b;
      font-size:11px;
      line-height:1.55;
      padding:8px 3px;
    }

    /* ---------- Main artwork background ---------- */

    .main {
      min-width:0;
      min-height:0;
      height:100%;
      display:grid;
      place-items:center;
      padding:18px;
      overflow:hidden;
      position:relative;
      isolation:isolate;
      background:#090c11;
    }

    .main-bg {
      position:absolute;
      inset:-12%;
      z-index:0;
      opacity:0;
      pointer-events:none;
      background-image:var(--main-bg-image);
      background-size:cover;
      background-position:center;
      filter:blur(54px) saturate(1.35) brightness(.78);
      transform:scale(1.12);
      transition:opacity .45s ease, transform .55s ease;
      will-change:opacity, transform;
    }

    .main.has-song-art .main-bg {
      opacity:.68;
      transform:scale(1.17);
    }

    .main-overlay {
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 35%, rgba(11,15,24,.08), rgba(7,10,16,.46) 54%, rgba(6,9,14,.82) 100%),
        linear-gradient(180deg, rgba(7,10,16,.18), rgba(7,10,16,.52));
    }

    /* ---------- Player ---------- */

    .player {
      position:relative;
      z-index:1;
      width:min(540px,100%);
      max-height:calc(100vh - 30px);
      max-height:calc(100dvh - 30px);
      padding:18px 20px 16px;
      overflow:hidden;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.105);
      background:
        linear-gradient(180deg, rgba(20,27,38,.79), rgba(13,18,26,.74));
      box-shadow:
        0 30px 75px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter:blur(22px) saturate(1.18);
      -webkit-backdrop-filter:blur(22px) saturate(1.18);
    }

    .art {
      width:clamp(165px,31vh,245px);
      aspect-ratio:1;
      margin:0 auto 14px;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:18px;
      color:#dbe4ff;
      font-size:68px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.09), transparent 35%),
        linear-gradient(145deg,#273142,#1b2230);
      border:1px solid rgba(255,255,255,.09);
      box-shadow:
        0 20px 48px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.06);
      user-select:none;
    }

    .art::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
      border-radius:inherit;
    }

    .art img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .art-placeholder {
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
    }

    .now {
      min-width:0;
      text-align:center;
    }

    .now-title {
      color:#f8f9fc;
      font-size:clamp(20px,2.5vw,27px);
      font-weight:820;
      line-height:1.12;
      letter-spacing:-.032em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .now-sub {
      margin-top:5px;
      color:#a2adbd;
      font-size:12.5px;
      font-weight:550;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .seek-wrap {
      margin-top:15px;
    }

    .range {
      width:100%;
      height:16px;
      margin:0;
      appearance:none;
      -webkit-appearance:none;
      background:transparent;
      cursor:pointer;
    }

    .range::-webkit-slider-runnable-track {
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
    }

    .range::-webkit-slider-thumb {
      width:13px;
      height:13px;
      margin-top:-4.5px;
      appearance:none;
      -webkit-appearance:none;
      border:0;
      border-radius:50%;
      background:#f8f9fb;
      box-shadow:0 2px 8px rgba(0,0,0,.28);
      transition:transform .12s ease;
    }

    .range:hover::-webkit-slider-thumb {
      transform:scale(1.08);
    }

    .range::-moz-range-track {
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
    }

    .range::-moz-range-progress {
      height:4px;
      border-radius:999px;
      background:var(--accent);
    }

    .range::-moz-range-thumb {
      width:13px;
      height:13px;
      border:0;
      border-radius:50%;
      background:#f8f9fb;
      box-shadow:0 2px 8px rgba(0,0,0,.28);
    }

    #seekBar {
      accent-color:var(--accent);
    }

    .times {
      margin-top:1px;
      display:flex;
      justify-content:space-between;
      color:#7d899a;
      font-size:9.5px;
      font-weight:650;
      font-variant-numeric:tabular-nums;
    }

    .controls {
      margin-top:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:11px;
    }

    .icon-btn {
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:transparent;
      color:#8c98aa;
      font-size:18px;
      transition:background .14s ease, color .14s ease, transform .14s ease;
    }

    .icon-btn svg {
      display:block;
      width:20px;
      height:20px;
      pointer-events:none;
    }

    .icon-btn:hover {
      color:white;
      background:rgba(255,255,255,.075);
      transform:translateY(-1px);
    }

    .icon-btn.active {
      color:#c7d0ff;
      background:rgba(130,149,255,.13);
    }

    .play-btn {
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#0c1017;
      background:linear-gradient(180deg,#ffffff,#e9edf5);
      font-size:24px;
      box-shadow:
        0 12px 28px rgba(0,0,0,.28),
        inset 0 1px 0 white;
      transition:transform .15s ease, box-shadow .15s ease;
    }

    .play-btn:hover {
      transform:scale(1.045);
      box-shadow:0 16px 32px rgba(0,0,0,.33);
    }

    .play-btn:active {
      transform:scale(.98);
    }

    .bottom {
      margin-top:11px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:12px;
      align-items:center;
    }

    .volume {
      display:flex;
      align-items:center;
      gap:7px;
      color:#8c98aa;
      font-size:13px;
      min-width:0;
    }

    .volume .range {
      max-width:105px;
    }

    .status {
      min-width:0;
      color:#7f8a9a;
      font-size:9.5px;
      font-weight:600;
      text-align:center;
      white-space:nowrap;
    }

    .clear {
      justify-self:end;
      padding:7px 8px;
      border-radius:9px;
      color:#7f8a9a;
      background:transparent;
      font-size:10px;
      font-weight:650;
      white-space:nowrap;
      transition:background .14s ease, color .14s ease;
    }

    .clear:hover {
      color:#ff9b9b;
      background:rgba(255,116,116,.09);
    }

    .hidden {
      display:none!important;
    }

    /* ---------- Chromebook tuning ---------- */

    @media (max-width:1180px) {
      .app {
        grid-template-columns:270px minmax(0,1fr);
      }

      .sidebar {
        padding:15px;
        gap:12px;
      }

      .player {
        width:min(500px,100%);
      }

      .art {
        width:clamp(155px,29vh,220px);
      }
    }

    @media (max-width:980px) {
      .app {
        grid-template-columns:245px minmax(0,1fr);
      }

      .sidebar {
        padding:13px;
        gap:10px;
      }

      .brand {
        font-size:17px;
      }

      .brand-icon {
        width:34px;
        height:34px;
      }

      .primary,
      .secondary,
      .search {
        font-size:12.5px;
      }

      .playlist-list {
        max-height:105px;
      }

      .player {
        width:min(460px,100%);
        padding:15px 17px 14px;
      }

      .art {
        width:clamp(145px,27vh,200px);
      }
    }

    @media (max-height:760px) {
      .sidebar {
        padding:13px;
        gap:10px;
      }

      .playlist-list {
        min-height:46px;
        max-height:92px;
      }

      .player {
        width:min(470px,100%);
        max-height:calc(100dvh - 20px);
        padding:14px 17px 13px;
        border-radius:20px;
      }

      .art {
        width:clamp(140px,25.5vh,185px);
        margin-bottom:10px;
        border-radius:15px;
      }

      .now-title {
        font-size:20px;
      }

      .now-sub {
        margin-top:3px;
        font-size:11px;
      }

      .seek-wrap {
        margin-top:10px;
      }

      .controls {
        margin-top:6px;
        gap:8px;
      }

      .icon-btn {
        width:34px;
        height:34px;
        font-size:16px;
      }

      .play-btn {
        width:47px;
        height:47px;
        font-size:20px;
      }

      .bottom {
        margin-top:7px;
      }

      .status,
      .clear {
        font-size:8.5px;
      }
    }

    @media (max-height:640px) {
      .playlist-list {
        max-height:68px;
      }

      .player {
        width:min(430px,100%);
        padding:11px 14px;
      }

      .art {
        width:clamp(120px,23vh,155px);
        margin-bottom:7px;
      }

      .now-title {
        font-size:18px;
      }

      .seek-wrap {
        margin-top:7px;
      }

      .controls {
        margin-top:4px;
      }

      .bottom {
        margin-top:4px;
      }

      .status {
        display:none;
      }
    }

    @media (max-width:760px) {
      .app {
        grid-template-columns:220px minmax(0,1fr);
      }

      .sidebar {
        padding:10px;
      }

      .volume {
        display:none;
      }

      .bottom {
        grid-template-columns:auto 1fr;
      }

      .status {
        text-align:left;
      }
    }

    @media (max-width:620px) {
      html,
      body {
        overflow:auto;
      }

      .app {
        height:auto;
        min-height:100dvh;
        grid-template-columns:1fr;
        overflow:visible;
      }

      .sidebar {
        height:auto;
        max-height:44dvh;
        border-right:0;
        border-bottom:1px solid var(--border);
      }

      .main {
        min-height:56dvh;
        height:auto;
        padding:12px;
      }

      .player {
        width:min(430px,100%);
        max-height:none;
      }
    }

  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">♫</div>
      <span>Local Music</span>
    </div>

    <div class="stack">
      <button id="addFolderBtn" class="primary">Add Music Folder</button>
      <button id="shufflePlaylistBtn" class="secondary">Shuffle Playlist</button>
      <input
        id="folderInput"
        class="hidden"
        type="file"
        accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac"
        webkitdirectory
        directory
        multiple
      />
    </div>

    <div class="section-label">
      <span>Playlists</span>
      <span id="playlistCount">0</span>
    </div>

    <div id="playlistList" class="playlist-list">
      <div class="empty">Each folder you add becomes its own playlist.</div>
    </div>

    <input id="searchInput" class="search" type="search" placeholder="Search this playlist..." />

    <div class="section-label">
      <span id="libraryTitle">Up Next</span>
      <span id="trackCount">0 songs</span>
    </div>

    <div id="trackList" class="track-list">
      <div class="empty">Add a folder containing your downloaded MP3s.</div>
    </div>
  </aside>

  <main id="mainArea" class="main">
    <div class="main-bg" aria-hidden="true"></div>
    <div class="main-overlay" aria-hidden="true"></div>
    <section class="player">
      <div class="art">
        <img id="mainArtwork" alt="Album artwork" />
        <div id="mainArtPlaceholder" class="art-placeholder">♫</div>
      </div>

      <div class="now">
        <div id="nowTitle" class="now-title">No song selected</div>
        <div id="nowSub" class="now-sub">Add a music folder to begin</div>
      </div>

      <div class="seek-wrap">
        <input id="seekBar" class="range" type="range" min="0" max="100" step="0.1" value="0" />
        <div class="times">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="icon-btn" title="Shuffle">⤨</button>
        <button id="prevBtn" class="icon-btn" title="Previous" aria-label="Previous song">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <path d="M6 5h2v14H6V5Zm12.5 1.2v11.6a1 1 0 0 1-1.54.84L9 13.8a1 1 0 0 1 0-1.7l7.96-4.84a1 1 0 0 1 1.54.85Z"/>
          </svg>
        </button>
        <button id="playBtn" class="play-btn" title="Play/Pause">▶</button>
        <button id="nextBtn" class="icon-btn" title="Next" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <path d="M16 5h2v14h-2V5ZM5.5 6.2v11.6a1 1 0 0 0 1.54.84L15 13.8a1 1 0 0 0 0-1.7L7.04 7.26a1 1 0 0 0-1.54.85Z"/>
          </svg>
        </button>
        <button id="repeatBtn" class="icon-btn" title="Repeat">↻</button>
      </div>

      <div class="bottom">
        <div class="volume">
          <span>🔊</span>
          <input id="volumeBar" class="range" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>

        <div id="status" class="status">Local files only · no uploads</div>

        <button id="clearAllBtn" class="clear">Clear all playlists</button>
      </div>
    </section>
  </main>
</div>

<audio id="audio"></audio>

<script>
  const audio = document.getElementById('audio');
  const folderInput = document.getElementById('folderInput');
  const addFolderBtn = document.getElementById('addFolderBtn');
  const shufflePlaylistBtn = document.getElementById('shufflePlaylistBtn');
  const playlistList = document.getElementById('playlistList');
  const playlistCount = document.getElementById('playlistCount');
  const searchInput = document.getElementById('searchInput');
  const libraryTitle = document.getElementById('libraryTitle');
  const trackCount = document.getElementById('trackCount');
  const trackList = document.getElementById('trackList');

  const nowTitle = document.getElementById('nowTitle');
  const nowSub = document.getElementById('nowSub');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const seekBar = document.getElementById('seekBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const volumeBar = document.getElementById('volumeBar');
  const statusEl = document.getElementById('status');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const mainArea = document.getElementById('mainArea');
  const dynamicFavicon = document.getElementById('dynamicFavicon');
  const defaultFavicon = dynamicFavicon ? dynamicFavicon.href : '';
  const mainArtwork = document.getElementById('mainArtwork');
  const mainArtPlaceholder = document.getElementById('mainArtPlaceholder');

  let playlists = [];
  let activePlaylistIndex = -1;
  let tracks = [];
  let currentIndex = -1;
  let playOrder = [];
  let playPosition = -1;
  let isSeeking = false;

  let isShuffle = localStorage.getItem('localMusic_shuffle') === 'true';
  let repeatMode = Number(localStorage.getItem('localMusic_repeat') || 0);

  audio.volume = Number(localStorage.getItem('localMusic_volume') || 0.8);
  volumeBar.value = audio.volume;

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function parseTrackName(filename) {
    const base = filename.replace(/\.[^/.]+$/, '').replace(/_/g, ' ').trim();
    const parts = base.split(' - ');
    if (parts.length >= 2) {
      return {
        artist: parts[0].trim(),
        title: parts.slice(1).join(' - ').trim()
      };
    }
    return { artist: 'Local file', title: base };
  }

  function isAudioFile(file) {
    return file.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac)$/i.test(file.name);
  }


  function synchsafeToInt(bytes) {
    return ((bytes[0] & 0x7f) << 21) |
           ((bytes[1] & 0x7f) << 14) |
           ((bytes[2] & 0x7f) << 7) |
           (bytes[3] & 0x7f);
  }

  function findTextEnd(bytes, start, encoding) {
    if (encoding === 1 || encoding === 2) {
      for (let i = start; i < bytes.length - 1; i += 2) {
        if (bytes[i] === 0 && bytes[i + 1] === 0) return i;
      }
      return -1;
    }

    for (let i = start; i < bytes.length; i++) {
      if (bytes[i] === 0) return i;
    }
    return -1;
  }

  async function extractMp3Artwork(file) {
    if (!/\.mp3$/i.test(file.name)) return null;

    try {
      const buffer = await file.slice(0, Math.min(file.size, 8 * 1024 * 1024)).arrayBuffer();
      const bytes = new Uint8Array(buffer);

      if (
        bytes.length < 10 ||
        bytes[0] !== 0x49 ||
        bytes[1] !== 0x44 ||
        bytes[2] !== 0x33
      ) return null;

      const version = bytes[3];
      const tagSize = synchsafeToInt(bytes.slice(6, 10));
      const end = Math.min(bytes.length, 10 + tagSize);
      let offset = 10;

      while (offset + 10 <= end) {
        const id = String.fromCharCode(
          bytes[offset],
          bytes[offset + 1],
          bytes[offset + 2],
          bytes[offset + 3]
        );

        if (!id.trim() || bytes[offset] === 0) break;

        const frameSize = version === 4
          ? synchsafeToInt(bytes.slice(offset + 4, offset + 8))
          : new DataView(buffer, offset + 4, 4).getUint32(0, false);

        if (!frameSize || offset + 10 + frameSize > bytes.length) break;

        if (id === 'APIC') {
          const frame = bytes.slice(offset + 10, offset + 10 + frameSize);
          const encoding = frame[0];
          let pos = 1;

          let mimeEnd = pos;
          while (mimeEnd < frame.length && frame[mimeEnd] !== 0) mimeEnd++;

          const mime = new TextDecoder('iso-8859-1')
            .decode(frame.slice(pos, mimeEnd)) || 'image/jpeg';

          pos = mimeEnd + 1;
          pos += 1; // picture type

          const descriptionEnd = findTextEnd(frame, pos, encoding);
          if (descriptionEnd < 0) return null;

          pos = descriptionEnd + ((encoding === 1 || encoding === 2) ? 2 : 1);
          if (pos >= frame.length) return null;

          const image = new Blob([frame.slice(pos)], { type: mime });
          return URL.createObjectURL(image);
        }

        offset += 10 + frameSize;
      }
    } catch {}

    return null;
  }

  async function loadArtwork(track) {
    track.artworkUrl = await extractMp3Artwork(track.file);
    renderTracks();

    if (currentIndex >= 0 && tracks[currentIndex] === track) {
      updateMainArtwork(track);
      updateMediaSession();
    }
  }

  function updateMainArtwork(track) {
    if (track && track.artworkUrl) {
      mainArtwork.src = track.artworkUrl;
      mainArtwork.style.display = 'block';
      mainArtPlaceholder.style.display = 'none';

      mainArea.style.setProperty('--main-bg-image', `url("${track.artworkUrl}")`);
      mainArea.classList.add('has-song-art');

      if (dynamicFavicon) {
        dynamicFavicon.href = track.artworkUrl;
      }
    } else {
      mainArtwork.removeAttribute('src');
      mainArtwork.style.display = 'none';
      mainArtPlaceholder.style.display = 'grid';

      mainArea.style.setProperty('--main-bg-image', 'none');
      mainArea.classList.remove('has-song-art');

      if (dynamicFavicon && defaultFavicon) {
        dynamicFavicon.href = defaultFavicon;
      }
    }
  }

  function shuffledIndexes(indexes) {
    const result = [...indexes];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function buildPlayOrder(keepCurrent = true) {
    const all = tracks.map((_, index) => index);
    const active = keepCurrent ? currentIndex : -1;

    if (isShuffle) {
      if (active >= 0) {
        playOrder = [active, ...shuffledIndexes(all.filter(i => i !== active))];
        playPosition = 0;
      } else {
        playOrder = shuffledIndexes(all);
        playPosition = -1;
      }
    } else {
      playOrder = all;
      playPosition = active >= 0 ? playOrder.indexOf(active) : -1;
    }
  }

  function ensurePlayOrder() {
    if (
      playOrder.length !== tracks.length ||
      playOrder.some(i => i < 0 || i >= tracks.length)
    ) {
      buildPlayOrder(true);
    }
  }

  function currentQueue() {
    ensurePlayOrder();

    if (currentIndex >= 0 && playPosition >= 0) {
      return playOrder.slice(playPosition);
    }

    return playOrder;
  }

  function getSelectedFolderName(files) {
    const first = files[0];
    const relative = first.webkitRelativePath || '';
    if (relative.includes('/')) return relative.split('/')[0];
    return 'Music';
  }

  function makeTrack(file) {
    const parsed = parseTrackName(file.name);

    const track = {
      file,
      url: URL.createObjectURL(file),
      title: parsed.title,
      artist: parsed.artist,
      artworkUrl: null
    };

    loadArtwork(track);
    return track;
  }

  function revokePlaylist(playlist) {
    playlist.tracks.forEach(track => {
      try { URL.revokeObjectURL(track.url); } catch {}
      if (track.artworkUrl) {
        try { URL.revokeObjectURL(track.artworkUrl); } catch {}
      }
    });
  }

  function updateModeButtons() {
    shuffleBtn.classList.toggle('active', isShuffle);
    repeatBtn.classList.toggle('active', repeatMode !== 0);

    shuffleBtn.title = isShuffle ? 'Shuffle on' : 'Shuffle off';

    repeatBtn.textContent = repeatMode === 2 ? '↻¹' : '↻';
    repeatBtn.title =
      repeatMode === 0 ? 'Repeat off' :
      repeatMode === 1 ? 'Repeat all' :
      'Repeat one';

    localStorage.setItem('localMusic_shuffle', String(isShuffle));
    localStorage.setItem('localMusic_repeat', String(repeatMode));
  }

  function renderPlaylists() {
    playlistList.innerHTML = '';
    playlistCount.textContent = String(playlists.length);

    if (!playlists.length) {
      playlistList.innerHTML = '<div class="empty">Each folder you add becomes its own playlist.</div>';
      return;
    }

    playlists.forEach((playlist, index) => {
      const row = document.createElement('div');
      row.className = `playlist${index === activePlaylistIndex ? ' active' : ''}`;

      const select = document.createElement('button');
      select.className = 'playlist-select';
      select.type = 'button';

      const name = document.createElement('span');
      name.className = 'playlist-name';
      name.textContent = playlist.name;

      const meta = document.createElement('span');
      meta.className = 'playlist-meta';
      meta.textContent = `${playlist.tracks.length} ${playlist.tracks.length === 1 ? 'song' : 'songs'}`;

      select.append(name, meta);
      select.addEventListener('click', () => selectPlaylist(index));

      const remove = document.createElement('button');
      remove.className = 'playlist-remove';
      remove.type = 'button';
      remove.title = 'Remove playlist';
      remove.textContent = '×';
      remove.addEventListener('click', (e) => {
        e.stopPropagation();
        removePlaylist(index);
      });

      row.append(select, remove);
      playlistList.appendChild(row);
    });
  }

  function renderTracks() {
    trackList.innerHTML = '';

    const query = searchInput.value.trim().toLowerCase();
    const queue = currentQueue();

    libraryTitle.textContent =
      activePlaylistIndex >= 0
        ? `${playlists[activePlaylistIndex].name} · ${isShuffle ? 'Shuffled' : 'Up Next'}`
        : 'Up Next';

    trackCount.textContent = `${queue.length} ${queue.length === 1 ? 'song' : 'songs'}`;

    const visible = queue
      .map((trackIndex, queueIndex) => ({
        track: tracks[trackIndex],
        trackIndex,
        queueIndex
      }))
      .filter(({ track }) =>
        `${track.title} ${track.artist} ${track.file.name}`.toLowerCase().includes(query)
      );

    if (!visible.length) {
      trackList.innerHTML = `<div class="empty">${
        tracks.length ? 'No songs match your search.' : 'Add or select a playlist.'
      }</div>`;
      return;
    }

    visible.forEach(({ track, trackIndex, queueIndex }) => {
      const isCurrent = trackIndex === currentIndex;

      const row = document.createElement('button');
      row.className = `track${isCurrent ? ' active' : ''}`;
      row.type = 'button';

      const number = document.createElement('div');
      number.className = 'track-number';
      number.textContent = isCurrent && !audio.paused ? '▶' : String(queueIndex + 1);

      let art;

      if (track.artworkUrl) {
        art = document.createElement('img');
        art.className = 'track-art';
        art.src = track.artworkUrl;
        art.alt = '';
      } else {
        art = document.createElement('div');
        art.className = 'track-art-placeholder';
        art.textContent = '♫';
      }

      const info = document.createElement('div');
      info.style.minWidth = '0';

      const title = document.createElement('div');
      title.className = 'track-title';
      title.textContent = track.title;

      const sub = document.createElement('div');
      sub.className = 'track-sub';
      sub.textContent = isCurrent
        ? `${track.artist} · Playing now`
        : track.artist;

      info.append(title, sub);
      row.append(number, art, info);

      row.addEventListener('click', () => {
        const position = playOrder.indexOf(trackIndex);
        if (position >= 0) playPosition = position;
        playTrack(trackIndex, true);
      });

      trackList.appendChild(row);
    });
  }

  function addFolder(fileList) {
    const files = Array.from(fileList).filter(isAudioFile);

    if (!files.length) {
      statusEl.textContent = 'That folder has no supported audio files';
      folderInput.value = '';
      return;
    }

    const name = getSelectedFolderName(files);
    const newPlaylist = {
      name,
      tracks: files.map(makeTrack)
    };

    const existingIndex = playlists.findIndex(p => p.name === name);

    if (existingIndex >= 0) {
      if (activePlaylistIndex === existingIndex) {
        audio.pause();
        audio.removeAttribute('src');
      }
      revokePlaylist(playlists[existingIndex]);
      playlists[existingIndex] = newPlaylist;
      selectPlaylist(existingIndex);
    } else {
      playlists.push(newPlaylist);
      selectPlaylist(playlists.length - 1);
    }

    folderInput.value = '';
  }

  function selectPlaylist(index) {
    if (index < 0 || index >= playlists.length) return;

    audio.pause();
    audio.removeAttribute('src');

    activePlaylistIndex = index;
    tracks = playlists[index].tracks;
    currentIndex = -1;
    playOrder = [];
    playPosition = -1;
    searchInput.value = '';

    nowTitle.textContent = playlists[index].name;
    nowSub.textContent = `${tracks.length} local ${tracks.length === 1 ? 'song' : 'songs'}`;
    document.title = 'Local Music';
    currentTimeEl.textContent = '0:00';
    durationEl.textContent = '0:00';
    seekBar.value = 0;
    playBtn.textContent = '▶';
    statusEl.textContent = 'Playlist ready · local files only';
    updateMainArtwork(null);

    buildPlayOrder(false);
    renderPlaylists();
    renderTracks();
  }

  function removePlaylist(index) {
    if (index < 0 || index >= playlists.length) return;

    const removingActive = index === activePlaylistIndex;

    if (removingActive) {
      audio.pause();
      audio.removeAttribute('src');
    }

    revokePlaylist(playlists[index]);
    playlists.splice(index, 1);

    if (!playlists.length) {
      activePlaylistIndex = -1;
      tracks = [];
      currentIndex = -1;
      playOrder = [];
      playPosition = -1;

      nowTitle.textContent = 'No song selected';
      nowSub.textContent = 'Add a music folder to begin';
      document.title = 'Local Music';
      seekBar.value = 0;
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      statusEl.textContent = 'Local files only · no uploads';
      updateMainArtwork(null);

      renderPlaylists();
      renderTracks();
      return;
    }

    if (removingActive) {
      selectPlaylist(Math.min(index, playlists.length - 1));
    } else {
      if (index < activePlaylistIndex) activePlaylistIndex--;
      renderPlaylists();
      renderTracks();
    }
  }

  async function playTrack(index, preserveOrder = true) {
    if (!tracks.length || index < 0 || index >= tracks.length) return;

    currentIndex = index;

    if (!preserveOrder || playOrder.length !== tracks.length) {
      buildPlayOrder(true);
    } else {
      const position = playOrder.indexOf(index);
      if (position >= 0) playPosition = position;
      else buildPlayOrder(true);
    }

    const track = tracks[index];

    audio.src = track.url;
    nowTitle.textContent = track.title;
    nowSub.textContent = `${track.artist} · ${playlists[activePlaylistIndex].name}`;
    document.title = `Now Playing: ${track.title}`;
    updateMainArtwork(track);

    try {
      await audio.play();
      statusEl.textContent = `Playing · ${playlists[activePlaylistIndex].name}`;
    } catch {
      statusEl.textContent = 'Press play to start';
    }

    renderTracks();
    updateMediaSession();
  }

  function togglePlay() {
    if (!tracks.length) {
      folderInput.click();
      return;
    }

    if (currentIndex === -1) {
      ensurePlayOrder();

      if (isShuffle && playOrder.length) {
        playPosition = 0;
        playTrack(playOrder[0], true);
      } else {
        playPosition = 0;
        playTrack(0, true);
      }
      return;
    }

    if (audio.paused) audio.play();
    else audio.pause();
  }

  function nextTrack() {
    if (!tracks.length) return;

    if (repeatMode === 2 && currentIndex >= 0) {
      audio.currentTime = 0;
      audio.play();
      return;
    }

    ensurePlayOrder();
    let nextPosition = playPosition + 1;

    if (nextPosition >= playOrder.length) {
      if (repeatMode === 1) {
        buildPlayOrder(false);
        nextPosition = 0;
      } else {
        audio.pause();
        audio.currentTime = 0;
        playBtn.textContent = '▶';
        statusEl.textContent = 'End of playlist';
        renderTracks();
        return;
      }
    }

    playPosition = nextPosition;
    playTrack(playOrder[playPosition], true);
  }

  function previousTrack() {
    if (!tracks.length) return;

    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    ensurePlayOrder();
    let previousPosition = playPosition - 1;

    if (previousPosition < 0) {
      previousPosition = repeatMode === 1 ? playOrder.length - 1 : 0;
    }

    playPosition = previousPosition;
    playTrack(playOrder[playPosition], true);
  }

  function shufflePlaylist() {
    if (!tracks.length) {
      folderInput.click();
      return;
    }

    isShuffle = true;
    updateModeButtons();
    currentIndex = -1;
    buildPlayOrder(false);

    if (playOrder.length) {
      playPosition = 0;
      playTrack(playOrder[0], true);
    }
  }

  function updateMediaSession() {
    if (!('mediaSession' in navigator) || currentIndex < 0) return;

    const track = tracks[currentIndex];

    const metadata = {
      title: track.title,
      artist: track.artist,
      album: playlists[activePlaylistIndex].name
    };

    if (track.artworkUrl) {
      metadata.artwork = [{ src: track.artworkUrl }];
    }

    navigator.mediaSession.metadata = new MediaMetadata(metadata);

    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', previousTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }

  addFolderBtn.addEventListener('click', () => folderInput.click());
  folderInput.addEventListener('change', e => addFolder(e.target.files));

  shufflePlaylistBtn.addEventListener('click', shufflePlaylist);
  searchInput.addEventListener('input', renderTracks);

  playBtn.addEventListener('click', togglePlay);
  prevBtn.addEventListener('click', previousTrack);
  nextBtn.addEventListener('click', nextTrack);

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    updateModeButtons();
    buildPlayOrder(true);
    renderTracks();
  });

  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    updateModeButtons();
  });

  volumeBar.addEventListener('input', () => {
    audio.volume = Number(volumeBar.value);
    localStorage.setItem('localMusic_volume', String(audio.volume));
  });

  function previewSeek() {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      const previewTime = (Number(seekBar.value) / 100) * audio.duration;
      currentTimeEl.textContent = formatTime(previewTime);
    }
  }

  function commitSeek() {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = (Number(seekBar.value) / 100) * audio.duration;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }
    isSeeking = false;
  }

  seekBar.addEventListener('pointerdown', () => {
    isSeeking = true;
  });

  seekBar.addEventListener('input', previewSeek);

  seekBar.addEventListener('pointerup', commitSeek);
  seekBar.addEventListener('pointercancel', () => {
    isSeeking = false;
  });

  // Fallback for keyboard seeking and browsers that rely on change events.
  seekBar.addEventListener('change', commitSeek);

  audio.addEventListener('timeupdate', () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      if (!isSeeking) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
      durationEl.textContent = formatTime(audio.duration);
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('play', () => {
    playBtn.textContent = '❚❚';
    renderTracks();
    updateMediaSession();
  });

  audio.addEventListener('pause', () => {
    playBtn.textContent = '▶';
    renderTracks();
  });

  audio.addEventListener('ended', nextTrack);

  clearAllBtn.addEventListener('click', () => {
    audio.pause();
    audio.removeAttribute('src');

    playlists.forEach(revokePlaylist);

    playlists = [];
    activePlaylistIndex = -1;
    tracks = [];
    currentIndex = -1;
    playOrder = [];
    playPosition = -1;

    nowTitle.textContent = 'No song selected';
    nowSub.textContent = 'Add a music folder to begin';
    document.title = 'Local Music';
    currentTimeEl.textContent = '0:00';
    durationEl.textContent = '0:00';
    seekBar.value = 0;
    searchInput.value = '';
    statusEl.textContent = 'Local files only · no uploads';
    updateMainArtwork(null);

    renderPlaylists();
    renderTracks();
  });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input')) return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 5);
    } else if (e.code === 'ArrowLeft') {
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    } else if (e.code === 'ArrowUp') {
      e.preventDefault();
      audio.volume = Math.min(1, audio.volume + 0.05);
      volumeBar.value = audio.volume;
      localStorage.setItem('localMusic_volume', String(audio.volume));
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      audio.volume = Math.max(0, audio.volume - 0.05);
      volumeBar.value = audio.volume;
      localStorage.setItem('localMusic_volume', String(audio.volume));
    }
  });

  window.addEventListener('beforeunload', () => {
    playlists.forEach(revokePlaylist);
  });

  updateModeButtons();
  renderPlaylists();
  renderTracks();
</script>
</body>
</html>
